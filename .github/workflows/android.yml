name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle version is pinned here, not floating: AGP 9.5.0 requires 9.6.0.
      # The wrapper scripts are deliberately not committed, so CI provides Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # plan.md §13.1/13.3: the image's Android SDK is a convenience, not an
      # assumption. This step proves what is actually available before the build.
      - name: Probe Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --list_installed 2>/dev/null | head -40 || true
          else
            echo "sdkmanager is not on PATH"
          fi
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Lint
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace lintDebug || {
            echo "--- lint errors:"
            grep -E 'Error:' app/build/reports/lint-results-debug.txt || true
            exit 1
          }

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      # Gate 1 — plan.md §5.1/§16: the shared model and the domain rules must stay
      # pure Kotlin, so they can be tested on the JVM without an emulator.
      - name: "Gate: core/domain and core/model are Android-free"
        run: |
          set -euo pipefail
          BASE=app/src/main/java/io/github/sameerkapour1/bloom/core
          status=0
          for DIR in "$BASE/domain" "$BASE/model"; do
            if [ -d "$DIR" ] && grep -rIn --include='*.kt' -E '^import android\.' "$DIR"; then
              echo "::error file=$DIR::core/domain and core/model must not import Android classes (plan.md §5.1)"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "OK: core/domain and core/model are Android-free"

      # Gate 2 — plan.md §10: no user-facing string literals in feature code.
      - name: "Gate: no hardcoded UI strings"
        run: |
          set -euo pipefail
          if grep -rIn --include='*.kt' -E 'Text\(\s*"' app/src/main/java/io/github/sameerkapour1/bloom/feature; then
            echo "::error::Use stringResource(R.string...) instead of a literal (plan.md section 10)"
            exit 1
          fi
          echo "OK: no literal UI strings in feature code"

      # Gate 3 — plan.md §5.7: the merged manifest may not grow silently,
      # and must never gain INTERNET.
      - name: "Gate: merged manifest permissions match the allowlist"
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(find "${ANDROID_HOME:?ANDROID_HOME is required}" -path '*/build-tools/*/aapt2' -type f | sort -V | tail -1)
          echo "Using $AAPT2"
          "$AAPT2" dump permissions "$APK" \
            | grep -o 'android\.permission\.[A-Z_]*' \
            | sort -u > /tmp/actual-permissions.txt || true
          grep -v '^#' .github/allowed-permissions.txt | grep -v '^[[:space:]]*$' | sort -u > /tmp/allowed-permissions.txt
          echo "--- permissions in the APK:"
          cat /tmp/actual-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/actual-permissions.txt; then
            echo "::error::INTERNET permission must never ship in Release 1 (plan.md §5.7)"
            exit 1
          fi
          diff -u /tmp/allowed-permissions.txt /tmp/actual-permissions.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bloom-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
